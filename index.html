<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f4"><title>日常 Dayflow｜個人行程與任務管理</title><link rel="stylesheet" href="styles.css"></head>
<body><div id="authGate" class="auth-gate" aria-live="polite"><section class="auth-card"><div class="brand auth-brand"><span class="brand-mark">◷</span>日常 <small>DAYFLOW</small></div><p class="auth-eyebrow">YOUR PERSONAL SPACE</p><h1>讓每一天，<br>都有自己的節奏。</h1><p class="auth-copy">登入後即可查看你的行程與待辦。</p><button id="googleSignIn" class="google-button" type="button"><span class="google-g">G</span>使用 Google 帳戶登入</button><p id="authMessage" class="auth-message">登入後，你的資料會與帳戶綁定。</p><small class="auth-privacy">只有登入的帳戶可以存取此個人空間</small></section></div><div class="app" id="plannerApp" hidden>
<aside><div class="brand"><span class="brand-mark">◷</span>日常 <small>DAYFLOW</small></div><div class="nav-label">工作區</div><nav class="nav" aria-label="主選單"><button class="active" data-page="home"><span class="ico">⌂</span>今日總覽</button><button data-page="calendar"><span class="ico">▦</span>行事曆</button><button data-page="tasks"><span class="ico">☑</span>所有待辦</button></nav><div class="profile"><span class="avatar" id="profileAvatar">日</span><div><strong id="profileName">個人帳戶</strong><small id="profileEmail">已登入</small></div></div></aside>
<main><header class="topbar"><div class="crumb">工作區　/　<b id="crumb">今日總覽</b></div><div class="actions"><button class="icon-btn" id="signOutBtn" aria-label="登出" title="登出">↪</button><button class="icon-btn" id="notifyBtn" aria-label="設定提醒通知" title="啟用瀏覽器通知">♧<span class="indicator"></span></button><button class="primary" id="addBtn">＋ 新增</button></div></header>
<section class="greeting"><div class="eyebrow" id="weekday"></div><h1 id="greeting">今天，慢慢來也很好。</h1><div class="date-label" id="todayLabel"></div></section>
<section class="stats"><div class="stat"><div><div class="stat-label">今日行程</div><strong id="eventCount">0</strong></div><span class="stat-icon">◷</span></div><div class="stat"><div><div class="stat-label">待完成任務</div><strong id="todoCount">0</strong></div><span class="stat-icon">☑</span></div><div class="stat"><div><div class="stat-label">本週已完成</div><strong id="doneCount">0</strong></div><span class="stat-icon">✳</span></div></section>
<div class="layout"><section class="card"><div class="card-head"><div><div class="card-title">行事曆</div><div class="card-sub">行程與待辦，一覽掌握</div></div><div class="tabs" id="viewTabs"><button class="active" data-view="month">月</button><button data-view="week">週</button><button data-view="day">日</button></div></div><div class="calendar-controls"><button id="prev" aria-label="上一期">‹</button><button id="next" aria-label="下一期">›</button><strong id="period"></strong><button id="todayBtn">今天</button></div><div class="month-grid" id="monthGrid"></div><div class="week-view" id="weekView"></div><div class="day-view" id="dayView"></div></section>
<div class="right-col"><section class="card"><div class="card-head"><div><div class="card-title">待辦事項</div><div class="card-sub" id="taskSub">今天需要完成的事</div></div><button class="link-btn" id="allTasks">全部 →</button></div><div class="task-list" id="taskList"></div></section><section class="card"><div class="card-head"><div><div class="card-title">今日行程</div><div class="card-sub" id="agendaSub"></div></div></div><div class="agenda-list" id="agendaList"></div></section></div></div></main></div>
<div class="toast" id="toast" role="status"></div><div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">新增項目</h2><button class="close" id="closeBtn" aria-label="關閉">×</button></div><div class="type-switch"><button class="active" data-type="task">待辦事項</button><button data-type="event">行程</button></div><form id="itemForm" class="form-grid"><div class="field full"><label for="name">名稱</label><input id="name" required maxlength="80" placeholder="例如：準備簡報"></div><div class="field"><label for="date">日期</label><input id="date" type="date" required></div><div class="field" id="timeField"><label for="time">開始時間</label><input id="time" type="time" value="09:00"></div><div class="field" id="endField"><label for="endTime">結束時間</label><input id="endTime" type="time" value="10:00"></div><div class="field" id="reminderField"><label for="reminder">提前提醒（天）</label><input id="reminder" type="number" min="0" max="365" value="1"><small>0 代表到期日提醒</small></div><div class="field"><label for="category">分類</label><select id="category"><option value="work">工作</option><option value="personal">個人</option><option value="other">其他</option></select></div><div class="field full"><label for="note">備註（選填）</label><textarea id="note" placeholder="補充說明…"></textarea></div><div class="hint" id="reminderHint">每項待辦可獨立設定提醒天數。原型於頁面開啟時檢查提醒；關閉頁面時不保證送達。</div><div class="form-actions"><button class="delete" id="deleteBtn" type="button">刪除</button><button class="cancel" id="cancelBtn" type="button">取消</button><button class="primary" id="saveBtn" type="submit">儲存待辦</button></div></form></section></div>
<script>window.DAYFLOW_FIREBASE_CONFIG = {
  apiKey: "AIzaSyA_muXUKZVXy-3eK-9mhGsFSgRnudIns",
  authDomain: "project-1619483796582425528.firebaseapp.com",
  projectId: "project-1619483796582425528",
  appId: "1:1032187827290:web:87c378e697abb1b91af463"
};</script><script type="module" src="app.js"></script></body></html>
